version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: store_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    container_name: store_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_PATH=/app/storage/store.db
      - POS_DATA_PATH=/app/data/pos/brigade_pos.csv
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  consumer:
    build: ./api
    container_name: store_consumer
    command: ["python", "-m", "api.consumer"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_PATH=/app/storage/store.db
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  detector:
    build: ./detector
    container_name: store_detector
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ZONES_CONFIG_PATH=/app/data/zones/zones.json
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: store_dashboard
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
